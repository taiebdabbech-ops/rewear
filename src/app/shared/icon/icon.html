<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('home') {
      <path d="M4 11l8-6.5 8 6.5" />
      <path d="M6 9.5V19h4.5v-5h3v5H18V9.5" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-4-4" />
    }
    @case ('heart') {
      <path
        d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"
      />
    }
    @case ('heart-filled') {
      <path
        fill="currentColor"
        d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"
      />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
    }
    @case ('star') {
      <path
        fill="currentColor"
        stroke="none"
        d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"
      />
    }
    @case ('shield') {
      <path d="M12 3l7.5 3v5.5c0 4.8-3.2 8-7.5 9.5-4.3-1.5-7.5-4.7-7.5-9.5V6z" />
      <path d="M8.6 12l2.4 2.4 4.4-4.6" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6L6 18" />
    }
    @case ('bag') {
      <path d="M5 8h14l-1 12H6z" />
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
    }
    @case ('pin') {
      <path d="M12 21s7-6.3 7-11.8a7 7 0 0 0-14 0C5 14.7 12 21 12 21z" />
      <circle cx="12" cy="9.2" r="2.4" />
    }
    @case ('message') {
      <path d="M4 5h16v11H9.5L4 20z" />
    }
    @case ('upload') {
      <path d="M12 15V4M7 9l5-5 5 5" />
      <path d="M4 15v5h16v-5" />
    }
    @case ('chevron-down') {
      <path d="M6 9l6 6 6-6" />
    }
    @case ('filter') {
      <path d="M4 6h16M7 12h10M10 18h4" />
    }
    @case ('trash') {
      <path d="M4 7h16M10 11v6M14 11v6" />
      <path d="M6 7l1 13h10l1-13M9 7V4h6v3" />
    }
    @case ('edit') {
      <path d="M4 20h4L19 9l-4-4L4 16z" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7.5" />
    }
    @case ('leaf') {
      <path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" />
      <path d="M5 19l7-7" />
    }
    @case ('eye') {
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
      <circle cx="12" cy="12" r="3" />
    }
    @case ('logout') {
      <path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v6M12 7.6v.4" />
    }
    @case ('arrow-right') {
      <path d="M5 12h14M13 6l6 6-6 6" />
    }
    @case ('arrow-left') {
      <path d="M19 12H5M11 6l-6 6 6 6" />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 7l9 6 9-6" />
    }
    @case ('send') {
      <path d="M21 3L10 14" />
      <path d="M21 3l-7 18-4-7-7-4 18-7z" />
    }
    @case ('tag') {
      <path d="M3 12V4h8l10 10-8 8z" />
      <circle cx="7.5" cy="8.5" r="1.3" />
    }
  }
</svg>
